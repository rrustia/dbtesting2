# Server config
server.port=8080

# H2 in-memory database - good enough for development and demos
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL in console while developing, turn this off in prod
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Enable the H2 console locally so you can browse the data at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings - change this secret in production, obviously
app.jwt.secret=MySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong0123456789
app.jwt.expiration-ms=86400000
