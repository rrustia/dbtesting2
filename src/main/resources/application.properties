# Server config
server.port=8080

# H2 file database stored at the workspace root so data persists locally
spring.datasource.url=jdbc:h2:file:./taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL in console while developing, turn this off in prod
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Enable the H2 console locally so you can browse the data at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT settings - change this secret in production, obviously
app.jwt.secret=MySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong0123456789
app.jwt.expiration-ms=86400000
